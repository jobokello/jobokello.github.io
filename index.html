<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Count Down To Your Kiss</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Poppins;
color:white;
overflow:hidden;

background:linear-gradient(
135deg,
#1a001a,
#3b003b,
#6b0044,
#990033
);

text-align:center;

}

/* soft glow background */

body::before{

content:"";
position:absolute;
width:100%;
height:100%;

background:
radial-gradient(circle at 20% 30%, rgba(255,100,150,0.25), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(255,80,120,0.25), transparent 40%);

z-index:0;

}

/* container */

.container{

z-index:2;
padding:20px;

}

h1{

font-family:"Great Vibes",cursive;
font-size:70px;
margin-bottom:10px;

text-shadow:
0 0 10px #fff,
0 0 30px #ff6699,
0 0 50px #ff3366;

}

.subtitle{

margin-bottom:40px;
font-size:20px;
opacity:0.9;

}

/* heartbeat */

.heart{

font-size:60px;
margin-bottom:20px;

animation:beat 1.3s infinite;

}

@keyframes beat{

0%{transform:scale(1);}
25%{transform:scale(1.2);}
40%{transform:scale(1);}
60%{transform:scale(1.2);}
100%{transform:scale(1);}

}

/* timer */

.countdown{

display:flex;
gap:25px;
flex-wrap:wrap;
justify-content:center;

}

.box{

background:rgba(255,255,255,0.12);
padding:25px 35px;
border-radius:20px;

backdrop-filter: blur(12px);

box-shadow:
0 0 15px rgba(255,120,150,0.6);

}

.time{

font-size:48px;
font-weight:bold;

}

.label{

font-size:14px;
letter-spacing:2px;

}

/* floating hearts */

.floating{

position:absolute;
color:#ffb3cc;

animation:floatUp linear infinite;

}

@keyframes floatUp{

0%{

transform:translateY(100vh);
opacity:0;

}

50%{opacity:1;}

100%{

transform:translateY(-10vh);
opacity:0;

}

}

/* kiss scene */

.kiss-screen{

position:absolute;
top:0;
left:0;
width:100%;
height:100%;

display:flex;
justify-content:center;
align-items:center;

flex-direction:column;

background:radial-gradient(circle,#ff3366,#660033);

font-family:"Great Vibes";

font-size:80px;

opacity:0;
transition:1s;

}

.kiss-heart{

font-size:120px;
animation:beat 1s infinite;

}

</style>

</head>

<body>

<div class="container">

<div class="heart">❤️</div>

<h1>Count Down To Your Kiss</h1>

<div class="subtitle">
Every second brings me closer to kissing you Munchy 💋
</div>

<div class="countdown">

<div class="box">
<div id="days" class="time">00</div>
<div class="label">Days</div>
</div>

<div class="box">
<div id="hours" class="time">00</div>
<div class="label">Hours</div>
</div>

<div class="box">
<div id="minutes" class="time">00</div>
<div class="label">Minutes</div>
</div>

<div class="box">
<div id="seconds" class="time">00</div>
<div class="label">Seconds</div>
</div>

</div>

</div>

<!-- Kiss ending screen -->

<div id="kissScreen" class="kiss-screen">

<div class="kiss-heart">💋</div>

<div>It's Kiss Time</div>

</div>

<script>

/* SET DATE */

const targetDate =
new Date("May 29, 2026 20:00:00").getTime();

/* countdown */

const timer = setInterval(function(){

const now = new Date().getTime();

const distance = targetDate - now;

const days =
Math.floor(distance/(1000*60*60*24));

const hours =
Math.floor((distance%(1000*60*60*24))/(1000*60*60));

const minutes =
Math.floor((distance%(1000*60*60))/(1000*60));

const seconds =
Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML = days;
document.getElementById("hours").innerHTML = hours;
document.getElementById("minutes").innerHTML = minutes;
document.getElementById("seconds").innerHTML = seconds;

if(distance < 0){

clearInterval(timer);

document.querySelector(".container").style.display="none";

const screen =
document.getElementById("kissScreen");

screen.style.opacity="1";

}

},1000);

/* floating hearts */

function heart(){

const h = document.createElement("div");

h.classList.add("floating");

h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(Math.random()*25+10)+"px";

h.style.animationDuration=
(Math.random()*4+4)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},8000);

}

setInterval(heart,300);

</script>

</body>
</html>
