<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Count Down To Your Kiss</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;

font-family:Poppins;
color:white;
overflow:hidden;

background:linear-gradient(135deg,#1a001a,#6b0044,#990033);

text-align:center;
padding:20px;

}

/* container */

.container{

max-width:900px;
width:100%;

}

/* heading */

h1{

font-family:"Great Vibes",cursive;
font-size:clamp(40px,8vw,70px);
margin-bottom:10px;

text-shadow:
0 0 10px #fff,
0 0 30px #ff6699;

}

/* subtitle */

.subtitle{

font-size:clamp(16px,4vw,20px);
margin-bottom:30px;

}

/* heart animation */

.heart{

font-size:clamp(40px,10vw,60px);
margin-bottom:20px;

animation:beat 1.3s infinite;

}

@keyframes beat{

0%{transform:scale(1);}
25%{transform:scale(1.2);}
40%{transform:scale(1);}
60%{transform:scale(1.2);}
100%{transform:scale(1);}

}

/* countdown layout */

.countdown{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;

}

/* timer boxes */

.box{

background:rgba(255,255,255,0.15);
padding:20px;
border-radius:16px;

backdrop-filter:blur(10px);

}

.time{

font-size:clamp(28px,6vw,48px);
font-weight:bold;

}

.label{

font-size:12px;
letter-spacing:2px;

}

/* mobile layout */

@media (max-width:600px){

.countdown{

grid-template-columns:repeat(2,1fr);

}

}

</style>

</head>

<body>

<div class="container">

<div class="heart">❤️</div>

<h1>Count Down To Your Kiss</h1>

<div class="subtitle">
Every second brings me closer to kissing you Munchy 💋
</div>

<div class="countdown">

<div class="box">
<div id="days" class="time">00</div>
<div class="label">Days</div>
</div>

<div class="box">
<div id="hours" class="time">00</div>
<div class="label">Hours</div>
</div>

<div class="box">
<div id="minutes" class="time">00</div>
<div class="label">Minutes</div>
</div>

<div class="box">
<div id="seconds" class="time">00</div>
<div class="label">Seconds</div>
</div>

</div>

</div>

<script>

const targetDate =
new Date("April 1, 2026 20:00:00").getTime();

setInterval(function(){

const now = new Date().getTime();

const distance = targetDate - now;

const days =
Math.floor(distance/(1000*60*60*24));

const hours =
Math.floor((distance%(1000*60*60*24))/(1000*60*60));

const minutes =
Math.floor((distance%(1000*60*60))/(1000*60));

const seconds =
Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML=days;
document.getElementById("hours").innerHTML=hours;
document.getElementById("minutes").innerHTML=minutes;
document.getElementById("seconds").innerHTML=seconds;

},1000);

</script>

</body>
</html>
